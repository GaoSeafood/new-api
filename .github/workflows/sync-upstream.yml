name: Sync upstream

on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      UPSTREAM_REPOSITORY: "QuantumNous/new-api"
      UPSTREAM_BRANCH: "main"
      FORK_BRANCH: "main"
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "main"
          fetch-depth: 0

      - name: Compare with upstream and prepare a review branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet origin --prune
          git fetch --quiet upstream "$UPSTREAM_BRANCH" --no-tags
          count="$(git rev-list --count "origin/$FORK_BRANCH..upstream/$UPSTREAM_BRANCH")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [[ "$count" != 0 ]] || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "origin/$FORK_BRANCH"
          git switch --create automation/upstream-sync

          if git show-ref --verify --quiet refs/remotes/origin/automation/upstream-sync; then
            merge_log="$RUNNER_TEMP/previous-sync-merge.log"
            if ! git merge --no-edit --no-ff origin/automation/upstream-sync >"$merge_log" 2>&1; then
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              cat "$merge_log"
              if [[ -n "$conflicts" ]]; then
                printf 'Previous sync branch conflicts with the fork main branch. Resolve these files and rerun:\n%s\n' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              git merge --abort || true
              exit 1
            fi
          fi

          merge_log="$RUNNER_TEMP/upstream-merge.log"
          if ! git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH" >"$merge_log" 2>&1; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            non_config_conflicts="$(grep -Ev '^[.]github/' <<<"$conflicts" || true)"
            if [[ -z "$conflicts" || -n "$non_config_conflicts" ]]; then
              cat "$merge_log"
              if [[ -n "$conflicts" ]]; then
                printf 'Upstream merge conflicts require manual resolution:\n%s\n' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
              fi
              git merge --abort || true
              exit 1
            fi
            # Keep this fork's GitHub configuration when upstream changed the same paths.
            git restore --source="origin/$FORK_BRANCH" --staged --worktree -- .github
            git commit --no-edit
          fi

          # Upstream Actions files are fork-specific configuration and stay out of the sync PR.
          git restore --source="origin/$FORK_BRANCH" --staged --worktree -- .github
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve fork GitHub configuration"
          fi

          if git diff --quiet "origin/$FORK_BRANCH" HEAD; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "origin/$FORK_BRANCH" automation/upstream-sync)"
          manual_review=false
          if grep -Eiq '(^\.github/|(^|/)(Dockerfile[^/]*|docker-compose[^/]*|compose\.(yaml|yml))$|(^|/)(deploy|ops)/|(^|/)(model|models|migrations?|schema|database)(/|$)|(^|/)(models?\.py|[^/]*Model\.php)$|(^|/)\.env($|\.)|(^|/)AGENTS\.md$)' <<<"$changed_files"; then
            manual_review=true
          fi
          echo "manual_review=$manual_review" >> "$GITHUB_OUTPUT"

          git push origin HEAD:refs/heads/automation/upstream-sync

      - name: Open or refresh the review PR
        id: pr
        if: steps.sync.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'This PR syncs upstream %s into this fork.\n\n' "$UPSTREAM_REPOSITORY" > "$RUNNER_TEMP/pr-body.md"
          cat >> "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Merge conflicts stop the workflow. Automatic merge waits for every check and pauses if workflows, deployment files, environment files, or schema migrations change.
          EOF

          find_sync_pr() {
            gh api "repos/$GH_REPO/pulls?state=open&base=$FORK_BRANCH&per_page=100" \
              | jq -r --arg repo "$GH_REPO" '[.[] | select(.head.ref == "automation/upstream-sync" and .head.repo.full_name == $repo)] | .[0].number // empty'
          }

          pr_number="$(find_sync_pr)"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "chore: sync upstream" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --repo "$GH_REPO" --base "$FORK_BRANCH" --head "$GH_OWNER:automation/upstream-sync" --title "chore: sync upstream" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          pr_number="$(find_sync_pr)"
          [[ -n "$pr_number" ]] || { echo "Could not find the upstream sync PR after creating it."; exit 1; }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Mark protected upstream changes for manual review
        if: steps.sync.outputs.manual_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "Automatic upstream sync paused for manual review because this PR changes a workflow, deployment, environment, or schema file."

      - name: Run checks and start trusted auto-merge
        if: steps.sync.outputs.count != '0' && steps.sync.outputs.manual_review != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          repo_lower="$(tr '[:upper:]' '[:lower:]' <<<"$GH_REPO")"
          [[ "$(tr '[:upper:]' '[:lower:]' <<<"$head_repo")" == "$repo_lower" ]]
          [[ "$head_ref" == "automation/upstream-sync" && "$base_ref" == "$FORK_BRANCH" ]]

          before_run_number="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=$head_ref&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].run_number] | max // 0')"
          gh workflow run ci.yml --repo "$GH_REPO" --ref "$head_ref"

          checks_passed=false
          for attempt in $(seq 1 300); do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=$head_ref&event=workflow_dispatch&per_page=100")"
            run_json="$(jq -c --arg sha "$head_sha" --argjson before "$before_run_number" '[.workflow_runs[] | select(.head_sha == $sha and .run_number > $before)] | sort_by(.run_number) | last // empty' <<<"$runs")"
            if [[ -n "$run_json" ]]; then
              run_id="$(jq -r '.id' <<<"$run_json")"
              run_state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '[.status,.conclusion] | @tsv')"
              status="${run_state%%$'\t'*}"
              conclusion="${run_state#*$'\t'}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo "CI did not pass for upstream sync commit $head_sha ($conclusion)."; exit 1; }
                checks_passed=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$checks_passed" == "true" ]] || { echo "Timed out waiting for CI on upstream sync commit $head_sha."; exit 1; }

          current="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.state,.head.sha,.head.ref,.base.ref,.head.repo.full_name] | @tsv')"
          expected="$(printf 'open\t%s\t%s\t%s\t%s' "$head_sha" "automation/upstream-sync" "$FORK_BRANCH" "$GH_REPO")"
          [[ "$current" == "$expected" ]] || { echo "The sync PR changed while CI was running; leaving it open."; exit 1; }

          gh workflow run auto-merge.yml --repo "$GH_REPO" --ref "$FORK_BRANCH" --field pr_number="$PR_NUMBER"
