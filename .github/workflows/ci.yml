name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  deploy:
    name: Deploy production after CI
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: new-api-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: new-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether production source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$TARGET_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$before_sha" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$TARGET_SHA")"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
      - name: Connect to the private server network
        if: steps.scope.outputs.changed == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tingjian-ci
          ping: 100.78.228.11
      - name: Deploy the verified commit over restricted SSH
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BEFORE_SHA: ${{ steps.scope.outputs.before_sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          private_key_file="$(mktemp "$HOME/.ssh/deploy-key.XXXXXX")"
          known_hosts_file="$(mktemp "$HOME/.ssh/known-hosts.XXXXXX")"
          trap 'rm -f "$private_key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private_key_file"
          chmod 600 "$private_key_file"
          unset DEPLOY_SSH_KEY
          printf '%s\n' '217.142.236.67 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN3QjQrhuDcmqAnqsFLgevYPee3JoRkh+R8qR20AI7jP' > "$known_hosts_file"
          if [[ "$BEFORE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            deploy_command="deploy $TARGET_SHA $BEFORE_SHA"
          else
            deploy_command="deploy $TARGET_SHA"
          fi
          ssh -i "$private_key_file" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" -o HostKeyAlias=217.142.236.67 tingjian-deploy@100.78.228.11 "$deploy_command"
